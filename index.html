<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Remittance Rate</title>
    <style>
        body { background-color: #0b111e; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .app-container { width: 100%; max-width: 400px; background: #111a2e; padding: 20px; border-radius: 20px; border: 1px solid #1f293d; }
        .rate-card { background: #0b111e; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .rate-value { color: #22c55e; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

<div class="app-container">
    <h2 style="text-align: center; color: #22c55e;">রেমিট্যান্স লাইভ রেট</h2>
    
    <div id="rates-list">
        <div class="rate-card"><span>ইসলামী ব্যাংক</span> <span class="rate-value" id="rate-ibbl">লোড হচ্ছে...</span></div>
        <div class="rate-card"><span>ডাচ-বাংলা ব্যাংক</span> <span class="rate-value" id="rate-dbbl">লোড হচ্ছে...</span></div>
        <div class="rate-card"><span>বিকাশ (bKash)</span> <span class="rate-value" id="rate-bkash">লোড হচ্ছে...</span></div>
        <div class="rate-card"><span>ব্যাংক ট্রান্সফার</span> <span class="rate-value" id="rate-transfer">লোড হচ্ছে...</span></div>
    </div>

    <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
    
    <input type="number" id="riyal-input" placeholder="কত রিয়াল?" style="width: 100%; padding: 10px; border-radius: 10px; border:none; margin-bottom: 10px;">
    <div id="result" style="text-align: center; font-weight: bold; color: #facc15;">হিসাব দেখতে রিয়াল বসান</div>
</div>

<script>
    async function updateRates() {
        try {
            const response = await fetch('https://api.exchangerate-api.com/v4/latest/SAR');
            const data = await response.json();
            const baseRate = data.rates.BDT;

            // ব্যাংক অনুযায়ী রেট (এখানে সামান্য তারতম্য সেট করে দেওয়া হয়েছে)
            document.getElementById('rate-ibbl').innerText = (baseRate + 0.10).toFixed(2);
            document.getElementById('rate-dbbl').innerText = (baseRate + 0.05).toFixed(2);
            document.getElementById('rate-bkash').innerText = (baseRate + 0.50).toFixed(2);
            document.getElementById('rate-transfer').innerText = baseRate.toFixed(2);

            document.getElementById('riyal-input').addEventListener('input', (e) => {
                const total = (e.target.value * (baseRate + 0.20)).toFixed(2);
                document.getElementById('result').innerText = "মোট পাবেন: " + total + " টাকা";
            });
        } catch (e) {
            document.getElementById('rates-list').innerHTML = "রেট লোড করা সম্ভব হয়নি।";
        }
    }
    updateRates();
</script>

</body>
</html>
