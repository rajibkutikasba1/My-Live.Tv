<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toffee Style FIFA Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <style>
        .toffee-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
        }
    </style>
</head>
<body class="toffee-gradient text-white font-sans min-h-screen">

    <div class="bg-slate-900/90 backdrop-blur-md p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center gap-2">
            <span class="text-2xl">⚽</span>
            <h1 class="text-xl font-black tracking-wider text-red-500">FIFA <span class="text-white">LIVE</span></h1>
        </div>
        <span class="bg-red-600 text-[10px] px-2.5 py-1 rounded-full font-bold uppercase tracking-widest animate-pulse">Live Streaming</span>
    </div>

    <div class="w-full max-w-4xl mx-auto mt-4 px-2">
        <div class="bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800 aspect-video">
            <video id="live-player" class="video-js vjs-default-skin vjs-big-play-centered w-full h-full" controls preload="auto" poster="https://placehold.co/640x360/000000/FFFFFF?text=Click+to+Play+Live+Match">
                <p class="vjs-no-js">To view this video please enable JavaScript</p>
            </video>
        </div>
        <div class="mt-4 bg-slate-900/50 p-3 rounded-xl border border-slate-800 text-center">
            <p class="text-xs text-slate-400 font-medium">বর্তমানে সম্প্রচারিত চ্যানেল</p>
            <h2 id="now-playing" class="text-md font-bold text-red-400 mt-0.5">T Sports Live</h2>
        </div>
    </div>

    <div class="max-w-4xl mx-auto px-4 mt-8 pb-16">
        <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2">
            <span class="w-2 h-2 bg-red-500 rounded-full"></span> ডাইরেক্ট চ্যানেল সার্ভার সমূহ:
        </h3>
        
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            
            <div onclick="playChannel('https://tsports-live.akamaized.net/hls/live/2092144/tsports/index.m3u8', 'T Sports Live')" 
                 class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800 flex flex-col items-center justify-center cursor-pointer hover:border-red-500 hover:bg-slate-800/80 transition-all duration-300 group shadow-md active:scale-95">
                <div class="w-14 h-14 bg-gradient-to-tr from-red-600 to-rose-400 rounded-full flex items-center justify-center font-black text-xl mb-3 shadow-lg group-hover:scale-110 transition duration-300">
                    🚩
                </div>
                <span class="font-bold text-sm tracking-wide group-hover:text-red-400 transition text-center">T Sports</span>
                <span class="text-[9px] text-slate-500 mt-1 uppercase">Direct Stream 1</span>
            </div>

            <div onclick="playChannel('https://live-gtv.akamaized.net/hls/live/2034267/gtv/index.m3u8', 'Gazi TV (GTV) Live')" 
                 class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800 flex flex-col items-center justify-center cursor-pointer hover:border-red-500 hover:bg-slate-800/80 transition-all duration-300 group shadow-md active:scale-95">
                <div class="w-14 h-14 bg-gradient-to-tr from-green-600 to-emerald-400 rounded-full flex items-center justify-center font-black text-xl mb-3 shadow-lg group-hover:scale-110 transition duration-300">
                    🇧🇩
                </div>
                <span class="font-bold text-sm tracking-wide group-hover:text-red-400 transition text-center">Gazi TV (GTV)</span>
                <span class="text-[9px] text-slate-500 mt-1 uppercase">Direct Stream 2</span>
            </div>

            <div onclick="playChannel('https://playertest.longtailvideo.com/adaptive/bipbop/bipbopall.m3u8', 'Sports Match Backup Server')" 
                 class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800 flex flex-col items-center justify-center cursor-pointer hover:border-red-500 hover:bg-slate-800/80 transition-all duration-300 group shadow-md active:scale-95">
                <div class="w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-400 rounded-full flex items-center justify-center font-black text-xl mb-3 shadow-lg group-hover:scale-110 transition duration-300">
                    ⚽
                </div>
                <span class="font-bold text-sm tracking-wide group-hover:text-red-400 transition text-center">FIFA Server 3</span>
                <span class="text-[9px] text-slate-500 mt-1 uppercase">International Feed</span>
            </div>

        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.3.0/video.js"></script>
    <script>
        var player = videojs('live-player');
        
        // প্রথম লোডেই ১ নম্বর চ্যানেলটি (T Sports) সেট করে রাখার জন্য
        player.src({ src: 'https://tsports-live.akamaized.net/hls/live/2092144/tsports/index.m3u8', type: 'application/x-mpegURL' });

        function playChannel(url, name) {
            player.src({ src: url, type: 'application/x-mpegURL' });
            document.getElementById('now-playing').innerText = name;
            player.play();
            // ক্লিক করলে স্মুথলি প্লেয়ারের কাছে স্ক্রল হবে
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
</body>
</html>
